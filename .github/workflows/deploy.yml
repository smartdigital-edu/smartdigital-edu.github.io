# Test, build and deploy to GitHub Pages.
#
# This repository deploys ONE app to its own GitHub Pages site, chosen by the
# repository variable APP (kiddora | grammarhub; default kiddora).
# Optionally it also builds the OTHER app and pushes it to a second repository's
# gh-pages branch, so one codebase can power both sites:
#   repo variables : SECOND_APP=grammarhub   SECOND_REPO=owner/Grammarhub.
#   repo secret    : SECOND_REPO_TOKEN  (fine-grained PAT with Contents: read & write on SECOND_REPO)
name: Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      APP: ${{ vars.APP || 'kiddora' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:${{ env.APP }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/${{ env.APP }} }
      - id: pages
        uses: actions/deploy-pages@v4

  deploy-second:
    needs: test
    if: ${{ vars.SECOND_APP != '' && vars.SECOND_REPO != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:${{ vars.SECOND_APP }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SECOND_REPO_TOKEN }}
          external_repository: ${{ vars.SECOND_REPO }}
          publish_branch: gh-pages
          publish_dir: dist/${{ vars.SECOND_APP }}
          force_orphan: true
