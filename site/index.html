<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Digital Edu – Kiddora & Grammar Hub</title>
  <meta name="description" content="Kiddora (bilingual early learning, ages 3–6) and Grammar Hub (KSSR English grammar, Year 1–6)." />
  <link rel="icon" type="image/png" href="./kiddora/icons/kiddora-192.png" />
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F5F0; color: #1F2430; padding: 24px; }
    main { width: 100%; max-width: 720px; }
    h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 4px; }
    p.lead { margin: 0 0 24px; color: #555c6b; }
    .apps { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    a.app { display: flex; gap: 16px; align-items: center; padding: 20px; border-radius: 18px; text-decoration: none; color: inherit;
            background: #fff; border: 2px solid transparent; box-shadow: 0 2px 10px rgb(0 0 0 / .06); transition: transform .15s, border-color .15s; }
    a.app:hover, a.app:focus-visible { transform: translateY(-2px); border-color: var(--c); outline: none; }
    a.app img { width: 64px; height: 64px; border-radius: 14px; flex: none; }
    a.app strong { display: block; font-size: 1.25rem; color: var(--c); }
    a.app span { font-size: .95rem; color: #555c6b; }
    footer { margin-top: 28px; font-size: .85rem; color: #7a8090; }
    @media (prefers-reduced-motion: reduce) { a.app { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Smart Digital Edu</h1>
    <p class="lead">Choose an app · Pilih aplikasi</p>
    <div class="apps">
      <a class="app" href="./kiddora/" style="--c:#E0573A">
        <img src="./kiddora/icons/kiddora-192.png" alt="" />
        <div><strong>Kiddora</strong><span>Ages 3–6 · English &amp; Bahasa Melayu</span></div>
      </a>
      <a class="app" href="./grammarhub/" style="--c:#0B63CE">
        <img src="./grammarhub/icons/grammarhub-192.png" alt="" />
        <div><strong>Grammar Hub</strong><span>KSSR English grammar · Year 1–6</span></div>
      </a>
    </div>
    <footer>Each app works offline and can be added to your home screen.</footer>
  </main>
</body>
</html>
