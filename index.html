<!doctype html>
<html lang="%APP_LANG%">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>%APP_TITLE%</title>
  <meta name="description" content="%APP_DESCRIPTION%" />
  <meta name="theme-color" content="%APP_THEME%" />
  <link rel="manifest" href="./manifest-%APP_ID%.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/%APP_ID%-192.png" />
  <!-- iOS home-screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
  <link rel="apple-touch-icon" href="./icons/%APP_ID%-180.png" />
</head>
<body data-app="%APP_ID%">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" aria-live="polite">
    <div class="boot-loader" role="status"><span class="spinner" aria-hidden="true"></span><p>Loading…</p></div>
  </div>
  <noscript>Please enable JavaScript to use %APP_NAME%.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
